# Smoke-test config: 3 jobs (1 code + 1 fact + 1 needle), 1k depth, single seed — runs in ~1 min.
[server]
base_url = "http://127.0.0.1:8002"
model = ""
request_timeout = 300

[run]
depths_k = [1]
seeds = [1000]
languages = ["ru"]
workers = 2
max_tokens = 256
temperature = 0.7
thinking = false
out_dir = "results"

[reduced_set]
enabled = true
depths_k = [1]
code_tasks = 1
fact_tasks = 1
needle_tasks = 1

[retry]
max_tokens = 1024
